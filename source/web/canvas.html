<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleKanban Canvas</title>
    <link rel="stylesheet" href="/canvas.css" />
  </head>
  <body>
    <main class="canvas-shell">
      <header class="canvas-hero">
        <div>
          <p class="canvas-eyebrow">SimpleKanban · Canvas Spike</p>
          <h1>Task Canvas</h1>
          <p class="canvas-subtitle">这一页只验证一件事：把现有 Task 投影成节点后，是否比列表页更适合作为后续主界面。</p>
        </div>

        <div class="canvas-hero-actions">
          <a id="canvas-workspace-link" class="ghost-link" href="/index.html#tasks-panel">返回工作台</a>
          <button id="refresh-canvas" class="primary-button" type="button">刷新数据</button>
        </div>
      </header>

      <section class="canvas-summary" aria-label="Canvas 概览">
        <article class="summary-card">
          <span class="label">当前项目</span>
          <strong id="summary-project" class="summary-value">未选择工程</strong>
        </article>
        <article class="summary-card">
          <span class="label">任务总数</span>
          <strong id="summary-total" class="summary-value">0</strong>
        </article>
        <article class="summary-card">
          <span class="label">活跃任务</span>
          <strong id="summary-active" class="summary-value">0 运行中 / 0 等待</strong>
        </article>
        <article class="summary-card">
          <span class="label">当前选中</span>
          <strong id="summary-selection" class="summary-value">未选择节点</strong>
        </article>
      </section>

      <section class="canvas-layout">
        <section class="canvas-board-panel">
          <div class="panel-head">
            <div>
              <h2>节点画布</h2>
              <p class="hint">当前采用自动布局：按依赖层级从左到右投影。现在只做观察与选中，不做拖拽编辑。</p>
            </div>
          </div>

          <div id="canvas-empty" class="canvas-empty" hidden>还没有任务卡。先回工作台创建任务，再回来观察 canvas 投影。</div>

          <div id="canvas-scroll" class="canvas-scroll" hidden>
            <svg id="canvas-links" class="canvas-links" aria-hidden="true"></svg>
            <div id="canvas-board" class="canvas-board"></div>
          </div>
        </section>

        <aside class="canvas-detail-panel">
          <div class="panel-head">
            <div>
              <h2>节点详情</h2>
              <p class="hint">这里先承载选中节点的说明、依赖和最近状态，后续再决定这些信息是否回流到统一详情面板。</p>
            </div>
          </div>

          <div id="canvas-detail" class="canvas-detail"></div>
        </aside>
      </section>
    </main>

    <script type="module" src="/canvas.js"></script>
  </body>
</html>
